<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a,b){
            return a+b
        }
        function minus(a,b){
            return a-b
        } function mul(a,b){
            return a*b
        }
        function div(a,b){
            return a/b
        }
        function mod(a,b){
            return a%b
        }
        // 결과를 콘솔(F12)과 화면 아래 글자 칸에 함께 보여준다
        function show(value){
            console.log(value);
            document.getElementById("result").textContent = "결과: " + value;
        }
        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        // 버튼 id와 계산 함수를 짝지어 두고, 반복문으로 한 번에 연결한다.
        const buttons = [
            { id: 'a', calc: plus },
            { id: 'b', calc: minus },
            { id: 'c', calc: mul },
            { id: 'd', calc: div },
            { id: 'e', calc: mod },
        ];
        document.addEventListener('DOMContentLoaded', function () {
            for (const { id, calc } of buttons) {
                document.querySelector('button#' + id).addEventListener('mouseover', function () {
                    show(calc(4, 6));
                });
            }
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <button id="a">덧셈</button>
    <button id="b">뺄셈</button>
    <button id="c">곱셈</button>
    <button id="d">나눗셈</button>
    <button id="e">나머지</button>
    <p id="result">버튼 위로 마우스를 올려 보세요</p>



</body>
</html>
