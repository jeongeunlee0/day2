<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a,b){
            return a+b
        }
        function minus(a,b){
            return a-b
        } function mul(a,b){
            return a*b
        }
        function div(a,b){
            return a/b
        }
        function mod(a,b){
            return a%b
        }
        // 결과를 콘솔(F12)과 화면 아래 글자 칸에 함께 보여준다
        function show(value){
            console.log(value);
            document.getElementById("result").textContent = "결과: " + value;
        }
        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('button#a').addEventListener('mouseover', function () {
                show(plus(4, 6));
            });
            document.querySelector('button#b').addEventListener('mouseover', function () {
                show(minus(4, 6));
            });
            document.querySelector('button#c').addEventListener('mouseover', function () {
                show(mul(4, 6));
            });
            document.querySelector('button#d').addEventListener('mouseover', function () {
                show(div(4, 6));
            });
            document.querySelector('button#e').addEventListener('mouseover', function () {
                show(mod(4, 6));
            });
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <button id="a">덧셈</button>
    <button id="b">뺄셈</button>
    <button id="c">곱셈</button>
    <button id="d">나눗셈</button>
    <button id="e">나머지</button>
    <p id="result">버튼 위로 마우스를 올려 보세요</p>



</body>
</html>
