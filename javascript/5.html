<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const  plus=(a,b)=>      a+b

        // head 안에서는 body가 아직 없으므로, 문서가 다 읽힌 뒤에 버튼에 이벤트를 연결한다.
        document.addEventListener('DOMContentLoaded', function () {
            console.log('5.html 준비 완료 - 숫자 두 개를 입력하고 덧셈 버튼을 눌러 보세요');
            document.querySelector('button#plus').addEventListener('click', function () {
                // 입력칸의 값은 문자열이라서, 더하기 전에 Number()로 숫자로 바꾼다.
                const a = document.querySelector('input#a').value;
                const b = document.querySelector('input#b').value;
                if (a === '' || b === '') {
                    document.querySelector('#result').textContent = '숫자 두 개를 모두 입력해 주세요';
                    return;
                }
                const sum = plus(Number(a), Number(b));
                console.log(sum);
                document.querySelector('#result').textContent = a + ' + ' + b + ' = ' + sum;
            });
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <input id="a" type="number" placeholder="첫 번째 숫자">
    <input id="b" type="number" placeholder="두 번째 숫자">
    <button  id="plus"  >덧셈</button>
    <p id="result"></p>
</body>
</html>
